services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://littup:littup@pgbouncer:5432/littup
      DATABASE_URL_DIRECT: postgresql+asyncpg://littup:littup@postgres:5432/littup
      # HF_HOME / SENTENCE_TRANSFORMERS_HOME / PADDLE_OCR_BASE_DIR are set in
      # the Dockerfile (all under /app/hf-cache) and the named volume below
      # mounts at the same path so weights survive container recreation.
      # After first warm, set HF_HUB_OFFLINE=1 in .env to skip freshness
      # probes (hundreds of HEAD requests per load).
      # Reach a host-side Ollama daemon from inside the container. On Linux,
      # extra_hosts (below) maps host.docker.internal to the host gateway;
      # on Docker Desktop (Mac/Windows) it resolves natively. Override in
      # .env if you run Ollama somewhere else.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - blob-data:/app/data
      - hf-cache:/app/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://littup:littup@pgbouncer:5432/littup
      DATABASE_URL_DIRECT: postgresql+asyncpg://littup:littup@postgres:5432/littup
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - blob-data:/app/data
      - hf-cache:/app/hf-cache
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: littup
      POSTGRES_PASSWORD: littup
      POSTGRES_DB: littup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littup -d littup"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: littup
      DB_PASSWORD: littup
      DB_NAME: littup
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  blob-data:
  hf-cache:
