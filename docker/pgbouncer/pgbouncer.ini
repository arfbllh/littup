[databases]
; Proxied by the bitnami/pgbouncer image via env vars.
; This file documents the equivalent manual config for reference.
; littup = host=postgres port=5432 dbname=littup

[pgbouncer]
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
auth_type = md5
; auth_file = /etc/pgbouncer/userlist.txt
listen_port = 5432
listen_addr = *
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
