default_locale: local

# Each tier tries providers top-to-bottom; the first one that's *active*
# (its env / API key is set) handles the call. If a provider raises
# ProviderUnavailable / RateLimited, the router falls over to the next.
# Setting OLLAMA_BASE_URL='' in .env disables every ollama-typed entry;
# clearing ANTHROPIC_API_KEY disables every anthropic-typed entry; etc.
tiers:
  extraction:
    providers:
      - ollama_local
      - anthropic_haiku
  generation:
    providers:
      - ollama_local
      - anthropic_sonnet
      - openai_gpt41
  validation:
    providers:
      - ollama_local
      - anthropic_haiku
  vision:
    providers:
      - anthropic_sonnet_vision
      - openai_gpt41_vision
  analysis:
    providers:
      - ollama_local
      - anthropic_sonnet

providers:
  # Local Ollama daemon (native /api/chat at OLLAMA_BASE_URL, default
  # http://localhost:11434). The provider is skipped when OLLAMA_BASE_URL is
  # absent from the environment. timeout_s is the *read* timeout; the provider
  # also enforces a 5 s connect timeout so a not-running daemon fails over
  # near-instantly.
  ollama_local:
    type: ollama
    # ``:cloud`` runs inference on Ollama's hosted infra (free, rate-limited);
    # swap for a locally pulled tag like ``qwen2.5:14b-instruct-q4_K_M`` for
    # fully-local inference.
    model: nemotron-3-super:cloud
    timeout_s: 120
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0

  anthropic_haiku:
    type: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.0008
    output_cost_per_1k: 0.004
  anthropic_sonnet:
    type: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
  anthropic_sonnet_vision:
    type: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015

  openai_gpt41:
    type: openai
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    input_cost_per_1k: 0.005
    output_cost_per_1k: 0.015
  openai_gpt41_vision:
    type: openai
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    input_cost_per_1k: 0.005
    output_cost_per_1k: 0.015

  gemini_pro:
    type: gemini
    model: gemini-2.5-pro
    api_key_env: GEMINI_API_KEY
    input_cost_per_1k: 0.00125
    output_cost_per_1k: 0.005

cache:
  enabled: true
  ttl_hours: 24
  backend: postgres

budget:
  hourly_usd: 5.0
