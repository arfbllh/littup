default_locale: local

tiers:
  extraction:
    providers:
      - vllm_qwen25_14b
      - anthropic_haiku
  generation:
    providers:
      - vllm_qwen25_32b
      - anthropic_sonnet
      - openai_gpt41
  validation:
    providers:
      - vllm_qwen25_7b
      - anthropic_haiku
  vision:
    providers:
      - anthropic_sonnet_vision
      - openai_gpt41_vision
  analysis:
    providers:
      - vllm_qwen25_32b
      - anthropic_sonnet

providers:
  vllm_qwen25_7b:
    type: vllm
    base_url: http://vllm:8001/v1
    model: Qwen/Qwen2.5-7B-Instruct
    timeout_s: 60
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0
  vllm_qwen25_14b:
    type: vllm
    base_url: http://vllm:8001/v1
    model: Qwen/Qwen2.5-14B-Instruct
    timeout_s: 60
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0
  vllm_qwen25_32b:
    type: vllm
    base_url: http://vllm:8001/v1
    model: Qwen/Qwen2.5-32B-Instruct-AWQ
    timeout_s: 90
    input_cost_per_1k: 0.0
    output_cost_per_1k: 0.0
  anthropic_haiku:
    type: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.0008
    output_cost_per_1k: 0.004
  anthropic_sonnet:
    type: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
  anthropic_sonnet_vision:
    type: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY
    input_cost_per_1k: 0.003
    output_cost_per_1k: 0.015
  openai_gpt41:
    type: openai
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    input_cost_per_1k: 0.005
    output_cost_per_1k: 0.015
  openai_gpt41_vision:
    type: openai
    model: gpt-4.1
    api_key_env: OPENAI_API_KEY
    input_cost_per_1k: 0.005
    output_cost_per_1k: 0.015
  gemini_pro:
    type: gemini
    model: gemini-2.5-pro
    api_key_env: GEMINI_API_KEY
    input_cost_per_1k: 0.00125
    output_cost_per_1k: 0.005

cache:
  enabled: true
  ttl_hours: 24
  backend: postgres

budget:
  hourly_usd: 5.0
