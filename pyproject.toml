[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "littup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Observability
    "structlog>=24.2.0",
    # IDs (uuid7 installs as uuid_extensions)
    "uuid7>=0.1.0",
    # Config
    "python-dotenv>=1.0.0",
    # SSE
    "sse-starlette>=2.1.0",
    # LLM SDKs (stubs — used in M2)
    "anthropic>=0.30.0",
    "openai>=1.35.0",
    # Ingestion (stubs — used in M4/M5)
    "pdfplumber>=0.11.0",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "anyio>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
